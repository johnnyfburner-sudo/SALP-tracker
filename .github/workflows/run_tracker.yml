name: SEC Filing Tracker

on:
  schedule:
    - cron: '0 14 * * *'  # 9am ET
    - cron: '0 18 * * *'  # 1pm ET
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no email sent)'
        required: false
        default: 'true'

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Restore seen filings cache
        uses: actions/cache@v3
        with:
          path: seen_filings.json
          key: seen-filings-${{ runner.os }}
          restore-keys: seen-filings-
      - run: pip install requests anthropic
      - run: python sec_tracker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
      - name: Save seen filings cache
        uses: actions/cache@v3
        with:
          path: seen_filings.json
          key: seen-filings-${{ runner.os }}
