name: SEC Filing Tracker

on:
  schedule:
    - cron: '0 9 * * 1'  # weekly, not hourly
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no email sent)'
        required: false
        default: false'

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore filing state
        id: cache-restore
        uses: actions/cache/restore@v3
        with:
          path: |
            seen_filings.json
            positions.json
          key: filing-state-v2

      - run: pip install requests anthropic

      - run: python sec_tracker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}

      - name: Save filing state
        uses: actions/cache/save@v3
        with:
          path: |
            seen_filings.json
            positions.json
          key: filing-state-v2

      - name: Commit updated dashboard
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test_mode == 'false')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html || true
          git add positions.json || true
          git diff --staged --quiet || git commit -m "Auto-update dashboard from new 13F filing"
          git push || true
